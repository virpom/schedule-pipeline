services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: schedule_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schedule_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-schedule_bot}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  # Schedule Bot Application
  schedule-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedule_bot_app
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-schedule_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      
      # Bot
      BOT_TOKEN: ${BOT_TOKEN}
      ADMINS: ${ADMINS}
      
      # Redis (optional)
      USE_REDIS: ${USE_REDIS:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./schedule_data:/home/appuser/app/schedule_data:ro
      - bot_logs:/home/appuser/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app-network

  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: schedule_bot_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    command: >
      sh -c "
        if [ -n \"$${REDIS_PASSWORD}\" ]; then
          exec redis-server --requirepass \"$${REDIS_PASSWORD}\"
        else
          exec redis-server
        fi
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bot_logs:
    driver: local

networks:
  app-network:
    driver: bridge